<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New Car Stock Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Public+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --fg:#161a20; --muted:#5b6472; --line:#d9dde3;
  --accent:#c8102e; --accent-fg:#ffffff;
  --yard:#1f8a4c; --yard-bg:#e3f4ea; --soon:#b36a00; --soon-bg:#fdeed7; --later:#4b5563; --later-bg:#e8eaee; --bad:#b91c1c; --bad-bg:#fde2e2;
  --display:"Barlow Semi Condensed",system-ui,sans-serif; --body:"Public Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#13161b; --card:#1d2129; --fg:#eef0f3; --muted:#a3abb8; --line:#333a45;
  --accent:#ef3b55; --accent-fg:#ffffff;
  --yard:#4ccf82; --yard-bg:#15361f; --soon:#f0a93a; --soon-bg:#3a2a0d; --later:#b4bcc8; --later-bg:#2a303a; --bad:#ff7070; --bad-bg:#431515;
  color-scheme:dark }}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:760px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.top{display:flex;align-items:center;gap:12px;min-height:48px}
button{font-family:var(--body)}
.back{display:none;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;font:600 18px var(--body);padding:10px 16px;cursor:pointer;min-height:48px}
.back.show{display:flex}
:is(button,input):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font:700 23px/1.1 var(--display);margin:0;text-wrap:balance;flex:1;min-width:0}
h1 small{display:block;font:600 14px var(--body);color:var(--muted);margin-top:2px}
.who{border:0;background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 10px;font:600 13px var(--body);cursor:pointer;min-height:34px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:6px;margin-top:10px;background:var(--bg);padding:4px;border-radius:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 16px var(--body);padding:12px 6px;border-radius:10px;cursor:pointer;min-height:48px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.search{margin-top:10px;position:relative}
.search input{width:100%;font:400 18px var(--body);padding:13px 44px 13px 16px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);min-height:52px}
.search input::placeholder{color:var(--muted)}
.search .clr{position:absolute;right:6px;top:6px;bottom:6px;width:40px;border:0;background:transparent;color:var(--muted);font-size:26px;cursor:pointer;border-radius:10px;display:none}
.search .clr.show{display:block}
main{padding-top:14px}
.hint{color:var(--muted);font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:16px;cursor:pointer;min-height:96px}
.card:active,.row:active{transform:scale(.98)}
.card .name{font:700 24px/1.1 var(--display)}
.nums{display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap}
.pill.yard{background:var(--yard-bg);color:var(--yard)}
.pill.soon{background:var(--soon-bg);color:var(--soon)}
.pill.later,.pill.nodate{background:var(--later-bg);color:var(--later)}
.pill.overdue,.pill.aged,.pill.sold{background:var(--bad-bg);color:var(--bad)}
.pill.big{font-size:17px;padding:6px 12px}
.pill b{font-size:1.15em}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;min-height:64px}
.row .t{flex:1;min-width:0}
.row .t .n{font:700 20px/1.15 var(--display)}
.row .t .s{color:var(--muted);font-size:15px}
.row .count{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.row .chev{color:var(--muted);font-size:22px}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none}
.car{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.car.is-sold{opacity:.75;border-style:dashed}
.car .l1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.car .l1 .n{font:700 20px/1.15 var(--display);flex:1 1 100%;min-width:0}
.car .meta{color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:4px 14px}
.car .meta b{color:var(--fg);font-weight:600}
.car .acc{font-size:15px;background:var(--bg);padding:6px 10px;border-radius:8px;display:inline-block;justify-self:start}
.car .soldby{font-size:15px;color:var(--bad);font-weight:600}
.btn{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;font:600 17px var(--body);padding:12px 16px;cursor:pointer;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.small{font-size:15px;padding:8px 12px;min-height:40px}
.btn:disabled{opacity:.5;cursor:default}
.confirm{display:grid;gap:10px;background:var(--bg);border-radius:12px;padding:12px}
.confirm label{font-size:14px;color:var(--muted);font-weight:600;display:grid;gap:4px}
.confirm input{width:100%;font:400 17px var(--body);padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);min-height:46px}
.confirm .acts{display:flex;gap:8px;flex-wrap:wrap}
.confirm .acts .btn{flex:1}
.err{color:var(--bad);font-size:15px;font-weight:600}
.empty{color:var(--muted);padding:30px 10px;text-align:center;font-size:17px}
.foot{margin-top:28px;color:var(--muted);font-size:13px;line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.crumb{color:var(--muted);font-size:15px;margin:0 0 10px}
.crumb b{color:var(--fg)}
.status{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.status span{flex:1;min-width:0}
.status .btn{flex:none;font-size:13px;padding:5px 10px;min-height:32px}
.banner{background:var(--bad-bg);color:var(--bad);font-weight:600;padding:10px 14px;border-radius:12px;margin:12px 0 0;font-size:15px}
.banner.warn{background:var(--soon-bg);color:var(--soon)}
.linkrow{margin-top:22px;display:flex;justify-content:center}
.gate{max-width:420px;margin:60px auto;display:grid;gap:12px;text-align:center}
.gate h1{font-size:30px}
.gate input{font:400 20px var(--body);padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);text-align:center;width:100%}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="wrap">
<div id="gate" class="gate" hidden>
  <h1>New Car Stock</h1>
  <p class="hint">Enter the passcode to open the stock list.</p>
  <input id="pass" type="password" placeholder="Passcode" autocomplete="off" inputmode="text">
  <button class="btn primary" id="passGo" type="button">Open</button>

</div>

<div id="app" hidden>
<header>
  <div class="top">
    <button class="back" id="back" type="button">&#8592; Back</button>

    <button class="who" id="who" type="button" title="Change your name">Set your name</button>
  </div>
  <div class="seg" role="group" aria-label="Which stock to show">
    <button type="button" id="segYard" aria-pressed="true">In the yard</button>
    <button type="button" id="segSoon" aria-pressed="false">Landing soon</button>
    <button type="button" id="segAll" aria-pressed="false">Everything</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Type a model, colour or variant (e.g. RAV4 white)" autocomplete="off">
    <button type="button" class="clr" id="clr" aria-label="Clear search">&times;</button>
  </div>
  <div class="status"><span id="stat"></span><button class="btn small" id="refresh" type="button">Refresh</button></div>
</header>
<div id="banner" class="banner" hidden></div>
<main id="main"></main>
<p class="foot" id="foot"></p>
</div>

", "stage": "later", "days": 0, "eta": "7 Jan", "etaIso": "2027-01-07", "prod": "11/26", "acc": null, "desc": "COXH Atmos CVT Hybrid AWD Atmos Hybrid AWD"}, {"batch": "13170860", "model": "Corolla Cross", "line": "COXH", "variant": "Atmos Hybrid", "sub": "AWD", "colour": "Feverish Red", "trim": "Black Genuine Leather Accented", "status": "A20", "stage": "later", "days": 0, "eta": "13 Jan", "etaIso": "2027-01-13", "prod": "11/26", "acc": null, "desc": "COXH Atmos CVT Hybrid AWD Atmos Hybrid AWD"}, {"batch": "13170866", "model": "Corolla Cross", "line": "COXH", "variant": "Atmos Hybrid Two Tone", "sub": "AWD", "colour": "Frosted White with Black Roof", "trim": "Black Genuine Leather Accented", "status": "A20", "stage": "later", "days": 0, "eta": "21 Dec", "etaIso": "2026-12-21", "prod": "11/26", "acc": null, "desc": "COXH Atmos CVT Hybrid AWD Atmos Hyb AWD + TTP"}], "warnings": []}</script>
<script>
(function(){
const SAMPLE = JSON.parse(document.getElementById('sample').textContent);
const MODEL_ORDER = ['HiLux','RAV4','Prado','LandCruiser 300','Corolla','Corolla Cross','HiAce','Kluger','bZ4X','Camry','Yaris Cross','LandCruiser 70','C-HR','GR86'];
const SW = {'Glacier White':'#f2f2ef','Frosted White':'#eceff1','Arctic White':'#f5f5f5','French Vanilla':'#f1ead8','Dusty Bronze':'#8a7156','Precious Bronze':'#7a5c3e','Urban Rock':'#6f6a63','Massive Grey':'#5a5d62','Ash Slate':'#4e5660','Dark Grey':'#3a3d42','Graphite':'#4a4d52','Onyx Night':'#15161a','Eclipse Black':'#101114','Black Mica Metallic':'#141516','Stunning Silver':'#c3c6ca','Premium Silver':'#b9bcc0','Liquid Metal':'#a9adb3','Shadow Platinum':'#8d9196','Feverish Red':'#b3121f','Jasper Red':'#8c1a22','Sunglow':'#e3a92a','Ningaloo Blue':'#1f5f9e','Saturn Blue':'#5b7fa6','Storm Blue':'#2d3f6b','Daintree Green':'#2f5a46','Tanami Taupe':'#8c8372'};
const AGED = 60;
const STAGE_RANK = {yard:0,overdue:1,soon:2,later:3,nodate:4};

let DATA = null;          // latest payload
let view = 'yard';
let nav = {model:null, variant:null, colour:null, soldList:false};
let q = '';
let myName = '';
let openConfirm = null;   // batch currently showing a confirm panel
let busy = false;
let timer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const swatch = c => { const base = Object.keys(SW).find(k=>c.startsWith(k)); return SW[base]||'#999'; };
const ls = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

// ---------- passcode ----------
function unlocked(){ return !PASSCODE || ls.get('nvs_pass')===PASSCODE; }
function showGate(){ $('gate').hidden=false; $('app').hidden=true; $('pass').focus(); }
function tryPass(){ if($('pass').value.trim()===PASSCODE){ ls.set('nvs_pass',PASSCODE); start(); } else { $('passErr').hidden=false; } }
$('passGo').onclick = tryPass; $('pass').onkeydown = e=>{ if(e.key==='Enter') tryPass(); };

// ---------- data ----------
function units(){ return (DATA&&DATA.units)||[]; }
function available(){ return units().filter(u=>!u.sold); }
function inView(u){
  if(view==='yard') return u.stage==='yard';
  if(view==='soon') return u.stage==='yard'||u.stage==='soon'||u.stage==='overdue';
  return true;
}
function matchQ(u){
  if(!q) return true;
  const hay = (u.model+' '+u.variant+' '+u.sub+' '+u.colour+' '+u.trim+' '+(u.acc||'')+' '+u.batch).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function pool(){ return available().filter(u=>inView(u)&&matchQ(u)); }

async function load(silent){
  if(!SCRIPT_URL){
    if(!DATA){ DATA = JSON.parse(JSON.stringify(SAMPLE)); DATA.asOf='sample data'; DATA.stockUpdated='sample data'; }
    setStat('Sample data (no sheet connected)'); render(); return;
  }
  if(!silent) setStat('<span class="spin"></span> Updating');
  try{
    const r = await fetch(SCRIPT_URL+'?t='+Date.now(), {cache:'no-store'});
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    DATA = j; $('banner').hidden = true;
    setStat('Checked '+new Date().toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})+' · Stock list updated '+esc(j.stockUpdated||'?'));
    if(j.warnings&&j.warnings.length){ $('banner').className='banner warn'; $('banner').textContent=j.warnings.join('. '); $('banner').hidden=false; }
  }catch(e){
    $('banner').className='banner'; $('banner').textContent = DATA ? 'Could not refresh. Showing the last list this phone saw. Check your signal and tap Refresh.' : 'Could not load the stock list. Check your signal and tap Refresh.'; $('banner').hidden=false;
    setStat('Not updated');
  }
  render();
}
function setStat(h){ $('stat').innerHTML = h; }

async function post(body){
  if(!SCRIPT_URL){ // sample mode: fake it locally
    const u = units().find(x=>x.batch===body.batch);
    if(body.action==='sold'){ if(u.sold) return {ok:false,error:'Already sold',by:u.sold.name,when:u.sold.when}; u.sold={name:body.name,note:body.note,when:'just now'}; }
    else delete u.sold;
    return {ok:true};
  }
  const r = await fetch(SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  const j = await r.json();
  if(j.payload){ DATA = j.payload; }
  return j;
}

// ---------- pieces ----------
function stagePill(u, big){
  let txt;
  if(u.stage==='yard') txt = `<b>${u.days}</b> day${u.days===1?'':'s'} in yard`;
  else if(u.stage==='soon'||u.stage==='later') txt = `Due <b>${esc(u.eta)}</b>`;
  else if(u.stage==='overdue') txt = `Overdue, was due <b>${esc(u.eta)}</b>`;
  else txt = 'No date yet';
  return `<span class="pill ${u.stage}${big?' big':''}">${txt}</span>`;
}
function countPills(list, big){
  const c = {};
  list.forEach(u=>{ const k = (u.stage==='overdue')?'soon':u.stage; c[k]=(c[k]||0)+1; });
  const parts=[], B = big?' big':'';
  if(c.yard) parts.push(`<span class="pill yard${B}"><b>${c.yard}</b> in yard</span>`);
  if(c.soon) parts.push(`<span class="pill soon${B}"><b>${c.soon}</b> landing soon</span>`);
  if(c.later) parts.push(`<span class="pill later${B}"><b>${c.later}</b> on the way</span>`);
  if(c.nodate) parts.push(`<span class="pill nodate${B}"><b>${c.nodate}</b> no date</span>`);
  if(!parts.length) parts.push(`<span class="pill later${B}">none</span>`);
  return parts.join('');
}
function groupBy(list, key){
  const m = new Map();
  list.forEach(u=>{ const k = key(u); if(!m.has(k)) m.set(k,[]); m.get(k).push(u); });
  return m;
}
function carCard(u, showPath){
  const sold = !!u.sold;
  const path = showPath ? `<div class="meta"><span><b>${esc(u.model)} ${esc(u.variant)}</b>${u.sub?' · '+esc(u.sub):''} · ${esc(u.colour)}</span></div>` : '';
  let action = '';
  if(openConfirm===u.batch){
    action = `<div class="confirm" data-confirm="${esc(u.batch)}">
      <label>Your name<input type="text" data-f="name" value="${esc(myName)}" placeholder="Who sold it?" autocomplete="off"></label>
      ${sold?'':'<label>Deal number<input type="text" data-f="note" inputmode="numeric" maxlength="6" autocomplete="off"></label>'}
      <div class="err" data-err hidden></div>
      <div class="acts"><button type="button" class="btn" data-cancel>Cancel</button><button type="button" class="btn primary" data-go="${sold?'released':'sold'}">${sold?'Yes, put it back on sale':'Confirm sold'}</button></div>
    </div>`;
  } else if(sold){
    action = `<div><button type="button" class="btn small" data-open="${esc(u.batch)}">Not sold after all? Release it</button></div>`;
  } else {
    action = `<div><button type="button" class="btn primary small" data-open="${esc(u.batch)}">Mark as sold</button></div>`;
  }
  return `<div class="car${sold?' is-sold':''}" id="car-${esc(u.batch)}">
    <div class="l1"><span class="n">${esc(u.trim)}</span>${sold?`<span class="pill sold">SOLD</span>`:''}${stagePill(u)}${!sold&&u.stage==='yard'&&u.days>=AGED?`<span class="pill aged">Aged ${AGED}+</span>`:''}</div>
    ${path}
    ${sold?`<div class="soldby">Sold by ${esc(u.sold.name)}, ${esc(u.sold.when)}${u.sold.note?' · Deal '+esc(u.sold.note):''}</div>`:''}
    ${u.acc?`<span class="acc">Fitted: ${esc(u.acc)}</span>`:''}
    <div class="meta"><span>Batch <b>${esc(u.batch)}</b></span><span>Build <b>${esc(u.prod)}</b></span><span>Status <b>${esc(u.status)}</b></span></div>
    ${action}
  </div>`;
}
function sortCars(a,b){ return (STAGE_RANK[a.stage]-STAGE_RANK[b.stage]) || (b.days-a.days) || ((a.etaIso||'9')>(b.etaIso||'9')?1:-1); }

// ---------- screens ----------
function render(){
  if(!DATA) return;
  const p = pool();
  const main = $('main'), back = $('back');
  let html = '';
  $('who').textContent = myName || 'Set your name';
  const soldCount = units().filter(u=>u.sold).length;

  if(nav.soldList){
    back.classList.add('show');
    $('title').firstChild.textContent = 'Sold cars';
    $('sub').textContent = `${soldCount} marked as sold`;
    const L = units().filter(u=>u.sold);
    html += `<p class="hint">These are hidden from the stock lists. If one was marked by mistake, release it here.</p>`;
    html += L.length ? `<div class="list">${L.map(u=>carCard(u,true)).join('')}</div>` : `<div class="empty">Nothing marked as sold yet.</div>`;
  } else if(!nav.model){
    back.classList.remove('show');
    $('title').firstChild.textContent = 'New Car Stock';
    $('sub').textContent = `${p.length} car${p.length===1?'':'s'} ${view==='yard'?'in the yard':view==='soon'?'in yard or landing soon':'in total'}${q?' matching your search':''}`;
    html += `<p class="hint">Tap a model to see variants and colours.</p>`;
    const g = groupBy(p, u=>u.model);
    const order = [...g.keys()].sort((a,b)=>MODEL_ORDER.indexOf(a)-MODEL_ORDER.indexOf(b));
    if(!order.length) html += `<div class="empty">Nothing matches. Try "Everything" or clear the search.</div>`;
    html += `<div class="grid">` + order.map(m=>`<button type="button" class="card" data-model="${esc(m)}"><span class="name">${esc(m)}</span><span class="nums">${countPills(g.get(m))}</span></button>`).join('') + `</div>`;
    html += `<div class="linkrow"><button type="button" class="btn small" data-soldlist>Sold cars (${soldCount})</button></div>`;
  } else if(!nav.variant){
    back.classList.add('show');
    const mp = p.filter(u=>u.model===nav.model);
    $('title').firstChild.textContent = nav.model;
    $('sub').textContent = `${mp.length} car${mp.length===1?'':'s'}`;
    html += `<div class="legend">${countPills(mp,true)}</div><p class="hint">Tap a variant to see its colours.</p>`;
    const g = groupBy(mp, u=>u.variant+'||'+u.sub);
    const keys = [...g.keys()].sort((a,b)=>g.get(b).length-g.get(a).length || a.localeCompare(b));
    if(!keys.length) html += `<div class="empty">None left in this view.</div>`;
    html += `<div class="list">` + keys.map(k=>{ const [v,s]=k.split('||'); const L=g.get(k);
      return `<button type="button" class="row" data-variant="${esc(k)}"><span class="t"><span class="n">${esc(v)}</span>${s?`<div class="s">${esc(s)}</div>`:''}<div class="nums" style="margin-top:6px">${countPills(L)}</div></span><span class="count">${L.length}</span><span class="chev">&#8250;</span></button>`; }).join('') + `</div>`;
  } else if(!nav.colour){
    back.classList.add('show');
    const [v,s] = nav.variant.split('||');
    const vp = p.filter(u=>u.model===nav.model&&u.variant===v&&u.sub===s);
    $('title').firstChild.textContent = `${nav.model} ${v}`;
    $('sub').textContent = `${s?s+' · ':''}${vp.length} car${vp.length===1?'':'s'}`;
    html += `<p class="hint">Tap a colour to see each car.</p>`;
    const g = groupBy(vp, u=>u.colour);
    const keys = [...g.keys()].sort((a,b)=>g.get(b).length-g.get(a).length || a.localeCompare(b));
    if(!keys.length) html += `<div class="empty">None left in this view.</div>`;
    html += `<div class="list">` + keys.map(c=>{ const L=g.get(c);
      return `<button type="button" class="row" data-colour="${esc(c)}"><span class="swatch" style="background:${swatch(c)}"></span><span class="t"><span class="n">${esc(c)}</span><div class="nums" style="margin-top:6px">${countPills(L)}</div></span><span class="count">${L.length}</span><span class="chev">&#8250;</span></button>`; }).join('') + `</div>`;
  } else {
    back.classList.add('show');
    const [v,s] = nav.variant.split('||');
    const all = units().filter(u=>u.model===nav.model&&u.variant===v&&u.sub===s&&u.colour===nav.colour&&inView(u)&&matchQ(u));
    const avail = all.filter(u=>!u.sold).sort(sortCars), soldHere = all.filter(u=>u.sold);
    $('title').firstChild.textContent = `${nav.model} ${v}`;
    $('sub').textContent = `${nav.colour} · ${avail.length} available`;
    html += `<p class="crumb"><b>${esc(nav.model)}</b> &rsaquo; <b>${esc(v)}</b>${s?` (${esc(s)})`:''} &rsaquo; <b>${esc(nav.colour)}</b></p>`;
    if(!avail.length) html += `<div class="empty">None available in this colour.</div>`;
    html += `<div class="list">${avail.map(u=>carCard(u,false)).join('')}</div>`;
    if(soldHere.length) html += `<div class="group" style="margin-top:18px"><h2>Already sold <span>${soldHere.length}</span></h2><div class="list">${soldHere.map(u=>carCard(u,false)).join('')}</div></div>`;
  }
  main.innerHTML = html;
  wire(main);
  $('foot').innerHTML = `"In the yard" = physically at the dealership (Toyota status N01). "Landing soon" = Toyota ETA within 30 days. "On the way" = ETA more than 30 days out. "No date yet" = allocated but no ETA from Toyota. Days in yard are Toyota's count. Sold marks are shared with everyone and refresh every ${REFRESH_SECONDS} seconds.`;
}

function wire(main){
  main.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{nav.model=b.dataset.model;go();});
  main.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{nav.variant=b.dataset.variant;go();});
  main.querySelectorAll('[data-colour]').forEach(b=>b.onclick=()=>{nav.colour=b.dataset.colour;go();});
  main.querySelectorAll('[data-soldlist]').forEach(b=>b.onclick=()=>{nav.soldList=true;go();});
  main.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ openConfirm=b.dataset.open; render(); const f=document.querySelector(`[data-confirm="${openConfirm}"] input`); if(f&&!myName) f.focus(); });
  main.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{ openConfirm=null; render(); });
  main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>submit(b.closest('[data-confirm]'), b.dataset.go));
}

async function submit(panel, action){
  if(busy) return;
  const batch = panel.dataset.confirm;
  const name = (panel.querySelector('[data-f="name"]').value||'').trim();
  const noteEl = panel.querySelector('[data-f="note"]');
  const note = noteEl ? noteEl.value.trim() : '';
  const err = panel.querySelector('[data-err]');
  if(!name){ err.textContent='Put your name in first.'; err.hidden=false; return; }
  if(action==='sold' && !/^\d{6}$/.test(note)){ err.textContent='Enter the deal number.'; err.hidden=false; return; }
  myName = name; ls.set('nvs_name', name);
  busy = true; panel.querySelectorAll('button').forEach(x=>x.disabled=true);
  err.hidden=false; err.innerHTML='<span class="spin"></span> Saving';
  try{
    const j = await post({action, batch, name, note});
    if(j.ok){ openConfirm=null; await load(true); }
    else { err.textContent = j.error==='Already sold' ? `Too late. ${j.by} marked this sold ${j.when}.` : (j.error||'Could not save.'); if(j.payload){ DATA=j.payload; setTimeout(()=>{openConfirm=null;render();},2500);} }
  }catch(e){ err.textContent='Could not save. Check your signal and try again.'; panel.querySelectorAll('button').forEach(x=>x.disabled=false); }
  busy=false;
}

function go(){ openConfirm=null; window.scrollTo({top:0}); render(); }
$('back').onclick = ()=>{ if(nav.soldList) nav.soldList=false; else if(nav.colour) nav.colour=null; else if(nav.variant) nav.variant=null; else nav.model=null; go(); };
[['segYard','yard'],['segSoon','soon'],['segAll','all']].forEach(([id,v])=>{
  $(id).onclick = ()=>{ view=v; ['segYard','segSoon','segAll'].forEach(i=>$(i).setAttribute('aria-pressed', i===id?'true':'false')); ls.set('nvs_view',v); render(); };
});
$('q').oninput = e=>{ q=e.target.value; $('clr').classList.toggle('show',!!q); render(); };
$('clr').onclick = ()=>{ q=''; $('q').value=''; $('clr').classList.remove('show'); $('q').focus(); render(); };
$('refresh').onclick = ()=>load(false);
$('who').onclick = ()=>{ const n = window.prompt ? null : null; // no native prompt; use inline panel
  const cur = myName; const panel = document.createElement('div'); panel.className='confirm'; panel.style.margin='12px 0 0';
  panel.innerHTML = `<label>Your name (shown when you mark a car sold)<input type="text" id="nameIn" value="${esc(cur)}" autocomplete="off"></label><div class="acts"><button type="button" class="btn" id="nameCancel">Cancel</button><button type="button" class="btn primary" id="nameSave">Save</button></div>`;
  const old = document.getElementById('namePanel'); if(old) old.remove();
  panel.id='namePanel'; document.querySelector('header').appendChild(panel); $('nameIn').focus();
  $('nameCancel').onclick=()=>panel.remove();
  $('nameSave').onclick=()=>{ myName=$('nameIn').value.trim(); ls.set('nvs_name',myName); panel.remove(); render(); };
};

function start(){
  $('gate').hidden=true; $('app').hidden=false;
  myName = ls.get('nvs_name')||'';
  const sv = ls.get('nvs_view'); if(sv&&['yard','soon','all'].includes(sv)){ view=sv; ['segYard','segSoon','segAll'].forEach(i=>$(i).setAttribute('aria-pressed', ({segYard:'yard',segSoon:'soon',segAll:'all'})[i]===sv?'true':'false')); }
  load(false);
  if(SCRIPT_URL){
    clearInterval(timer); timer = setInterval(()=>{ if(!busy && !openConfirm && document.visibilityState==='visible') load(true); }, REFRESH_SECONDS*1000);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !busy) load(true); });
  }
}
if(unlocked()) start(); else showGate();
})();
</script>
</body>
</html>
